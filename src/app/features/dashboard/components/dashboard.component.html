<div class="dashboard-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="app-title">Deltoi</h2>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="icon">📊</span> Dashboard
      </a>
      <a routerLink="/queries" routerLinkActive="active">
        <span class="icon">📋</span> All Queries
      </a>
      <a routerLink="/archived" routerLinkActive="active">
        <span class="icon">📦</span> Archived
      </a>
      <a routerLink="/trash" routerLinkActive="active">
        <span class="icon">🗑️</span> Trash
      </a>
    </nav>
    <div class="user-info">
      <div>
        <p>{{ userName }}</p>
      </div>
      <button mat-button color="warn" (click)="logout()">Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="dashboard-header">
      <mat-form-field appearance="fill">
        <input matInput placeholder="Search queries..." />
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="createNewQuery()">+ New Query</button>
    </div>

    <div class="queries-grid">
      <div class="query-card" *ngFor="let query of queries">
        <div class="query-header">
          <!-- Removed any 'method' reference -->
        </div>
        <div class="query-body">
          <p><strong>Title:</strong> {{ query.title }}</p>
          <p><strong>Description:</strong> {{ query.description }}</p>
          <p><strong>Status:</strong> {{ query.status }}</p>
        </div>
        <div class="query-actions">
          <button mat-button (click)="archive(query)">Archive</button>
          <button mat-button (click)="moveToTrash(query)">Trash</button>
        </div>
      </div>
    </div>
  </main>
</div>
