<div class="flex justify-center items-center min-h-screen bg-gray-900">
  <div class="bg-gray-800 rounded-lg shadow-lg p-8 w-full max-w-md">
    <div class="flex border-b border-gray-700 mb-6">
      <button (click)="switchTab('login')" [ngClass]="{'border-b-2 border-yellow-400 text-yellow-400': isLogin, 'text-gray-400': !isLogin}" class="px-4 py-2 font-semibold focus:outline-none">Login</button>
      <button (click)="switchTab('signup')" [ngClass]="{'border-b-2 border-yellow-400 text-yellow-400': !isLogin, 'text-gray-400': isLogin}" class="px-4 py-2 font-semibold focus:outline-none">Sign Up</button>
    </div>
    <form *ngIf="isLogin" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-4">
        <label class="block text-gray-300 mb-1">Email</label>
        <input formControlName="email" type="email" placeholder="Enter your email" class="w-full px-3 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-300 mb-1">Password</label>
        <input formControlName="password" type="password" placeholder="Enter your password" class="w-full px-3 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>
      <div class="flex items-center justify-between mb-4">
        <label class="flex items-center text-gray-400">
          <input type="checkbox" formControlName="remember" class="mr-2" /> Remember me
        </label>
        <a href="#" class="text-yellow-400 text-sm hover:underline">Forgot password?</a>
      </div>
      <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded">Login</button>
    </form>
    <form *ngIf="!isLogin" [formGroup]="signupForm" (ngSubmit)="onSignup()">
      <div class="mb-4">
        <label class="block text-gray-300 mb-1">Email</label>
        <input formControlName="email" type="email" placeholder="Enter your email" class="w-full px-3 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-300 mb-1">Password</label>
        <input formControlName="password" type="password" placeholder="Enter your password" class="w-full px-3 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>
      <div class="mb-6">
        <label class="block text-gray-300 mb-1">Confirm Password</label>
        <input formControlName="confirmPassword" type="password" placeholder="Confirm your password" class="w-full px-3 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>
      <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded">Sign Up</button>
    </form>
  </div>
</div>
