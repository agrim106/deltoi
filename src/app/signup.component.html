<div class="signup-container max-w-md mx-auto mt-10 p-6 bg-gray-900 rounded shadow">
  <h2 class="signup-title text-2xl font-bold mb-6 text-center">Sign Up</h2>
  <form [formGroup]="signupForm" (ngSubmit)="onSignup()" class="signup-form">
    <div class="mb-4">
      <label>Email</label>
      <input type="email" formControlName="email" class="w-full p-2 rounded bg-gray-800 text-white" />
    </div>
    <div class="mb-4">
      <label>Password</label>
      <input type="password" formControlName="password" class="w-full p-2 rounded bg-gray-800 text-white" />
    </div>
    <div class="mb-4">
      <label>Confirm Password</label>
      <input type="password" formControlName="confirmPassword" class="w-full p-2 rounded bg-gray-800 text-white" />
    </div>
    <div *ngIf="error" class="signup-error text-red-500 mb-2">{{ error }}</div>
    <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-4 rounded">Sign Up</button>
  </form>
  <div class="mt-4 text-center">
    <a routerLink="/login" class="signup-link text-yellow-400 hover:underline">Already have an account? Login</a>
  </div>
</div>
