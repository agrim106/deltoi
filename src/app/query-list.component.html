<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">Queries</h1>
  <div class="mb-4 flex justify-between items-center">
    <input type="text" placeholder="Search queries..." class="border border-gray-600 rounded px-3 py-2 bg-gray-900 text-white w-full max-w-xs focus:outline-none focus:ring-2 focus:ring-yellow-500" />
    <button class="ml-4 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded">
      + New Query
    </button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let query of queries" class="bg-gray-800 rounded-lg p-6 shadow-md">
      <div class="flex items-center mb-2">
        <span class="text-xs font-semibold px-2 py-1 rounded bg-green-600 text-white mr-2">{{ query.method }}</span>
        <span class="text-lg font-semibold text-white">{{ query.endpoint }}</span>
      </div>
      <p class="text-gray-400 text-sm mb-4">Created {{ query.created | date }}</p>
      <div class="flex space-x-2">
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded">Edit</button>
        <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded">Delete</button>
      </div>
    </div>
  </div>
</div>
